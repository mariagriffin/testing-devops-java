name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Checkstyle
        run: mvn checkstyle:check

      - name: Coverage summary
        run: |
          echo "Coverage report:"
          cat target/site/jacoco/index.html | grep -m 1 "Coverage"
